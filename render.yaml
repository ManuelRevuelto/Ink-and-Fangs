# Despliegue en Render (https://render.com) — ver docs/online.md
services:
  - type: web
    name: ink-and-fangs
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
